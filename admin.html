<script type="module">

/* =========================
   SUPABASE
========================= */

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://zyhcplznilkhfjeocoet.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_jB4eqptL-Egyagl9u0r8wA_wnVoWLkf";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================
   MONTHS
========================= */

const months=[

"فروردین",
"اردیبهشت",
"خرداد",
"تیر",
"مرداد",
"شهریور",
"مهر",
"آبان",
"آذر",
"دی",
"بهمن",
"اسفند"

];


/* =========================
   JALALI
========================= */

function gregorianToJalali(gy,gm,gd){

let gdm=[
0,31,59,90,120,151,
181,212,243,273,304,334
];

let jy;

if(gy>1600){

jy=979;
gy-=1600;

}else{

jy=0;
gy-=621;

}

let gy2=(gm>2)?gy+1:gy;

let days=
365*gy
+
Math.floor((gy2+3)/4)
-
Math.floor((gy2+99)/100)
+
Math.floor((gy2+399)/400)
-
80
+
gd
+
gdm[gm-1];

jy+=33*Math.floor(days/12053);

days%=12053;

jy+=4*Math.floor(days/1461);

days%=1461;

if(days>365){

jy+=Math.floor((days-1)/365);

days=(days-1)%365;

}

let jm;
let jd;

if(days<186){

jm=1+Math.floor(days/31);

jd=1+(days%31);

}else{

jm=7+Math.floor((days-186)/30);

jd=1+((days-186)%30);

}

return [jy,jm,jd];

}


function jalaliToGregorian(jy,jm,jd){

jy=parseInt(jy);
jm=parseInt(jm);
jd=parseInt(jd);

let gy;

if(jy>979){

gy=1600;
jy-=979;

}else{

gy=621;

}

let days=
365*jy
+
Math.floor(jy/33)*8
+
Math.floor(((jy%33)+3)/4)
+
78
+
jd
+
(
jm<7
?
((jm-1)*31)
:
(((jm-7)*30)+186)
);

gy+=400*Math.floor(days/146097);

days%=146097;

if(days>36524){

gy+=100*Math.floor(--days/36524);

days%=36524;

if(days>=365)
days++;

}

gy+=4*Math.floor(days/1461);

days%=1461;

if(days>365){

gy+=Math.floor((days-1)/365);

days=(days-1)%365;

}

let gd=days+1;

let sal_a=[
0,
31,
((gy%4===0 && gy%100!==0)||gy%400===0)?29:28,
31,
30,
31,
30,
31,
31,
30,
31,
30,
31
];

let gm=0;

while(gd>sal_a[gm]){

gd-=sal_a[gm];

gm++;

}

return [gy,gm,gd];

}


function persianNumber(num){

return String(num).replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}


/* =========================
   TODAY
========================= */

const now=new Date();

const todayJalali=
gregorianToJalali(
now.getFullYear(),
now.getMonth()+1,
now.getDate()
);


let selectedAdminDate={

year:todayJalali[0],
month:todayJalali[1],
day:todayJalali[2]

};


let adminCalendarDate={

year:todayJalali[0],
month:todayJalali[1]

};


/* =========================
   DATE TEXT
========================= */

function getSelectedDateText(){

return (

persianNumber(selectedAdminDate.day)
+
" "
+
months[selectedAdminDate.month-1]
+
" "
+
persianNumber(selectedAdminDate.year)

);

}


function updateDateButton(){

const text=
getSelectedDateText();

document
.getElementById("jalaliDateButton")
.textContent=text;

document
.getElementById("datePicker")
.value=
`${selectedAdminDate.year}-${String(selectedAdminDate.month).padStart(2,"0")}-${String(selectedAdminDate.day).padStart(2,"0")}`;

}


/* =========================
   SUPABASE DATE
========================= */

function getGregorianDateString(){

const g=
jalaliToGregorian(
selectedAdminDate.year,
selectedAdminDate.month,
selectedAdminDate.day
);

return (
String(g[0]).padStart(4,"0")
+
"-"
+
String(g[1]).padStart(2,"0")
+
"-"
+
String(g[2]).padStart(2,"0")
);

}


/* =========================
   LOAD APPOINTMENTS
========================= */

async function getAppointments(){

const {
data,
error
} =
await supabase
.from("appointments")
.select("*")
.order("appointment_time",{ascending:true});


if(error){

throw error;

}

return data || [];

}


/* =========================
   CALENDAR
========================= */

window.toggleAdminCalendar=function(){

const calendar=
document.getElementById("adminCalendar");

calendar.classList.toggle("show");

if(calendar.classList.contains("show")){

adminCalendarDate={

year:selectedAdminDate.year,
month:selectedAdminDate.month

};

renderAdminCalendar();

}

};


function renderAdminCalendar(){

const year=
adminCalendarDate.year;

const month=
adminCalendarDate.month;


document
.getElementById("adminCalendarMonth")
.textContent=
months[month-1]
+
" "
+
persianNumber(year);


const daysContainer=
document.getElementById("adminCalendarDays");

daysContainer.innerHTML="";


const firstGregorian=
jalaliToGregorian(
year,
month,
1
);


const firstDate=
new Date(
firstGregorian[0],
firstGregorian[1]-1,
firstGregorian[2]
);


const startDay=
(firstDate.getDay()+1)%7;


let daysInMonth;

if(month<=6){

daysInMonth=31;

}else if(month<=11){

daysInMonth=30;

}else{

daysInMonth=30;

}


for(
let i=0;
i<startDay;
i++
){

const empty=
document.createElement("div");

empty.className=
"admin-day empty";

daysContainer.appendChild(empty);

}


for(
let day=1;
day<=daysInMonth;
day++
){

const div=
document.createElement("div");

div.className=
"admin-day";

div.textContent=
persianNumber(day);


if(
year===todayJalali[0] &&
month===todayJalali[1] &&
day===todayJalali[2]
){

div.classList.add("today");

}


if(
year===selectedAdminDate.year &&
month===selectedAdminDate.month &&
day===selectedAdminDate.day
){

div.classList.add("selected");

}


div.onclick=function(){

selectAdminDate(
year,
month,
day
);

};


daysContainer.appendChild(div);

}

}


function selectAdminDate(year,month,day){

selectedAdminDate={

year:year,
month:month,
day:day

};


updateDateButton();


document
.getElementById("adminCalendar")
.classList.remove("show");


loadForSelectedDate();

}


window.adminPreviousMonth=function(){

adminCalendarDate.month--;

if(adminCalendarDate.month<1){

adminCalendarDate.month=12;
adminCalendarDate.year--;

}

renderAdminCalendar();

};


window.adminNextMonth=function(){

adminCalendarDate.month++;

if(adminCalendarDate.month>12){

adminCalendarDate.month=1;
adminCalendarDate.year++;

}

renderAdminCalendar();

};


window.changeDate=function(direction){

let gregorian=
jalaliToGregorian(
selectedAdminDate.year,
selectedAdminDate.month,
selectedAdminDate.day
);


const date=
new Date(
gregorian[0],
gregorian[1]-1,
gregorian[2]
);


date.setDate(
date.getDate()+direction
);


const jalali=
gregorianToJalali(
date.getFullYear(),
date.getMonth()+1,
date.getDate()
);


selectedAdminDate={

year:jalali[0],
month:jalali[1],
day:jalali[2]

};


updateDateButton();


loadForSelectedDate();

};


/* =========================
   TIME
========================= */

function timeToMinutes(time){

if(!time) return 0;

const cleanTime=
String(time).substring(0,5);

const parts=
cleanTime.split(":");

return (
Number(parts[0])*60+
Number(parts[1])
);

}


function minutesToTime(minutes){

let h=
Math.floor(minutes/60);

let m=
minutes%60;


return (
String(h).padStart(2,"0")
+
":"
+
String(m).padStart(2,"0")
);

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(text){

return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   SERVICE CHECK
========================= */

function isVipAppointment(item){

return (
String(item.service || "")
.trim()
===
"اصلاح VIP"
);

}


/* =========================
   LOAD SELECTED DATE
========================= */

window.loadForSelectedDate=
async function(){

const container=
document.getElementById("appointments");


container.innerHTML=
`
<div class="loading">
در حال دریافت نوبت‌ها...
</div>
`;


try{

const all=
await getAppointments();


const selectedDateGregorian=
getGregorianDateString();


const selectedDateText=
getSelectedDateText();


const list=
all.filter(item=>{

if(item.appointment_date){

return String(
item.appointment_date
).substring(0,10)
===
selectedDateGregorian;

}


if(item.date){

return item.date===selectedDateText;

}

return false;

});


/* =========================
   SORT BY REAL TIME
========================= */

list.sort(
(a,b)=>
timeToMinutes(
a.appointment_time || a.time
)
-
timeToMinutes(
b.appointment_time || b.time
)
);


/* =========================
   STATS
========================= */

document
.getElementById("totalCount")
.textContent=
list.length;


document
.getElementById("normalCount")
.textContent=
list.filter(
x=>!isVipAppointment(x)
).length;


document
.getElementById("vipCount")
.textContent=
list.filter(
x=>isVipAppointment(x)
).length;


/* =========================
   EMPTY
========================= */

if(list.length===0){

container.innerHTML=
`
<div class="empty">

📭

<br><br>

برای این تاریخ نوبتی ثبت نشده

</div>
`;

return;

}


/* =========================
   RENDER
========================= */

container.innerHTML="";


list.forEach(item=>{

const vip=
isVipAppointment(item);


const startTime=
item.appointment_time
?
String(item.appointment_time).substring(0,5)
:
(
item.time
?
String(item.time).substring(0,5)
:
"--:--"
);


/*
مدت نوبت:

اول appointment_minute
بعد duration_minutes
اگر هر دو خالی بودند:
VIP = 60
اصلاح = 30
*/

const duration =
Number(item.appointment_minute)
||
Number(item.duration_minutes)
||
(
vip
?
60
:
30
);


const end=
minutesToTime(
timeToMinutes(startTime)+duration
);


const div=
document.createElement("div");


div.className=
"appointment"
+
(vip ? " vip" : "");


div.innerHTML=`

<div class="appointment-time">

${escapeHtml(startTime)}

</div>


<div class="service-name">

${vip
? "👑 اصلاح VIP"
: "✂️ اصلاح"}

</div>

/* =========================
   DELETE
========================= */

window.deleteAppointment=
async function(id){

if(!id){

alert(
"شناسه نوبت پیدا نشد."
);

return;

}


const confirmed=
confirm(
"آیا از حذف این رزرو مطمئن هستید؟"
);


if(!confirmed){

return;

}


try{

const {
error
} =
await supabase
.from("appointments")
.delete()
.eq("id",id);


if(error){

throw error;

}


alert(
"رزرو با موفقیت حذف شد."
);


await loadForSelectedDate();


}catch(error){

console.error(
"DELETE ERROR:",
error
);


alert(
"خطا در حذف رزرو:\n"
+
error.message
);

}

};


/* =========================
   LOGIN
========================= */

window.login=
async function(){

const email=
document
.getElementById("adminEmail")
.value
.trim();


const password=
document
.getElementById("adminPassword")
.value;


const button=
document
.getElementById("loginButton");


const errorBox=
document
.getElementById("loginError");


errorBox.innerHTML="";


if(!email){

errorBox.innerHTML=
`
<div class="error-box">
لطفاً ایمیل مدیر را وارد کنید.
</div>
`;

return;

}


if(!password){

errorBox.innerHTML=
`
<div class="error-box">
لطفاً رمز مدیریت را وارد کنید.
</div>
`;

return;

}


button.disabled=true;

button.textContent=
"در حال ورود...";


try{

const {
data,
error
} =
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error){

throw error;

}


if(!data.session){

throw new Error(
"ورود انجام نشد."
);

}


sessionStorage.setItem(
"esiAdmin",
"true"
);


showAdmin();


}catch(error){

console.error(
"LOGIN ERROR:",
error
);


errorBox.innerHTML=
`
<div class="error-box">

❌ ورود ناموفق بود

<br>

${escapeHtml(error.message)}

</div>
`;

}finally{

button.disabled=false;

button.textContent=
"ورود به پنل";

}

};


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(){

document
.getElementById("loginPage")
.style.display="none";


document
.getElementById("adminPage")
.style.display="block";


updateDateButton();


await loadForSelectedDate();

}


/* =========================
   LOGOUT
========================= */

window.logout=
async function(){

await supabase.auth.signOut();


sessionStorage.removeItem(
"esiAdmin"
);


location.reload();

};


/* =========================
   ENTER LOGIN
========================= */

document
.getElementById("adminPassword")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

login();

}

}
);


/* =========================
   START
========================= */

async function start(){

const {
data
} =
await supabase.auth.getSession();


if(data.session){

sessionStorage.setItem(
"esiAdmin",
"true"
);


await showAdmin();

}else{

document
.getElementById("loginPage")
.style.display="block";


document
.getElementById("adminPage")
.style.display="none";

}

}


start();

</script>
