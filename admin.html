<script type="module">

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://zyhcplznilkhfjeocoet.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jB4eqptL-Egyagl9u0r8wA_wnVoWLkf";


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options={}
){

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {

                ...options,

                headers:{
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }

            }
        );


    const text =
        await response.text();


    let data = null;


    if(text){

        try{

            data =
                JSON.parse(text);

        }catch{

            data = text;

        }

    }


    if(!response.ok){

        let message =
            "خطا در ارتباط با Supabase";


        if(data){

            if(data.message){

                message =
                    data.message;

            }else if(data.error){

                message =
                    data.error;

            }else if(data.hint){

                message =
                    data.hint;

            }else if(
                typeof data === "string"
            ){

                message =
                    data;

            }

        }


        throw new Error(message);

    }


    return data;

}


/* =====================================================
   MONTHS
===================================================== */

const months=[

"فروردین",
"اردیبهشت",
"خرداد",
"تیر",
"مرداد",
"شهریور",
"مهر",
"آبان",
"آذر",
"دی",
"بهمن",
"اسفند"

];


/* =====================================================
   JALALI VARIABLES
===================================================== */

let todayJalali;

let selectedAdminDate;

let adminCalendarDate;


/* =====================================================
   GREGORIAN → JALALI
===================================================== */

function gregorianToJalali(
    gy,
    gm,
    gd
){

let gdm=[
0,31,59,90,120,151,
181,212,243,273,304,334
];

let jy;

if(gy>1600){

jy=979;

gy-=1600;

}else{

jy=0;

gy-=621;

}

let gy2=
(gm>2)
?
gy+1
:
gy;

let days=
365*gy
+
Math.floor((gy2+3)/4)
-
Math.floor((gy2+99)/100)
+
Math.floor((gy2+399)/400)
-
80
+
gd
+
gdm[gm-1];

jy+=
33*
Math.floor(days/12053);

days%=12053;

jy+=
4*
Math.floor(days/1461);

days%=1461;

if(days>365){

jy+=
Math.floor((days-1)/365);

days=
(days-1)%365;

}

let jm;

let jd;

if(days<186){

jm=
1+
Math.floor(days/31);

jd=
1+
(days%31);

}else{

jm=
7+
Math.floor((days-186)/30);

jd=
1+
((days-186)%30);

}

return [
    jy,
    jm,
    jd
];

}


/* =====================================================
   JALALI → GREGORIAN
===================================================== */

function jalaliToGregorian(
    jy,
    jm,
    jd
){

jy=parseInt(jy);

jm=parseInt(jm);

jd=parseInt(jd);

let gy;

if(jy>979){

gy=1600;

jy-=979;

}else{

gy=621;

}

let days=
365*jy
+
Math.floor(jy/33)*8
+
Math.floor(((jy%33)+3)/4)
+
78
+
jd
+
(
jm<7
?
((jm-1)*31)
:
(((jm-7)*30)+186)
);

gy+=
400*
Math.floor(days/146097);

days%=146097;

if(days>36524){

gy+=
100*
Math.floor(--days/36524);

days%=36524;

if(days>=365)
days++;

}

gy+=
4*
Math.floor(days/1461);

days%=1461;

if(days>365){

gy+=
Math.floor((days-1)/365);

days=
(days-1)%365;

}

let gd=
days+1;

let sal_a=[
0,
31,
(
(gy%4===0 &&
gy%100!==0)
||
gy%400===0
)
?
29
:
28,
31,
30,
31,
30,
31,
31,
30,
31,
30,
31
];

let gm=0;

while(
gd>sal_a[gm]
){

gd-=sal_a[gm];

gm++;

}

return [
    gy,
    gm,
    gd
];

}


/* =====================================================
   PERSIAN NUMBER
===================================================== */

function persianNumber(num){

return String(num).replace(
    /\d/g,
    d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}


/* =====================================================
   TODAY
===================================================== */

const now =
new Date();

todayJalali =
gregorianToJalali(
    now.getFullYear(),
    now.getMonth()+1,
    now.getDate()
);


selectedAdminDate={

    year:
        todayJalali[0],

    month:
        todayJalali[1],

    day:
        todayJalali[2]

};


adminCalendarDate={

    year:
        todayJalali[0],

    month:
        todayJalali[1]

};


/* =====================================================
   GET APPOINTMENTS
===================================================== */

async function getAppointments(){

    const data =
        await supabaseRequest(
            "/rest/v1/appointments" +
            "?select=*"
        );


    return data || [];

}


/* =====================================================
   DATE TEXT
===================================================== */

function getSelectedDateText(){

return (

persianNumber(
    selectedAdminDate.day
)

+
" "

+
months[
    selectedAdminDate.month-1
]

+
" "

+
persianNumber(
    selectedAdminDate.year
)

);

}


/* =====================================================
   DATE BUTTON
===================================================== */

function updateDateButton(){

const text =
    getSelectedDateText();


document
.getElementById(
    "jalaliDateButton"
)
.textContent =
    text;


document
.getElementById(
    "datePicker"
)
.value =

`${selectedAdminDate.year}-${
String(selectedAdminDate.month)
.padStart(2,"0")
}-${
String(selectedAdminDate.day)
.padStart(2,"0")
}`;

}


/* =====================================================
   CALENDAR TOGGLE
===================================================== */

window.toggleAdminCalendar =
function(){

const calendar =
    document.getElementById(
        "adminCalendar"
    );


calendar.classList.toggle(
    "show"
);


if(
    calendar.classList.contains(
        "show"
    )
){

adminCalendarDate={

    year:
        selectedAdminDate.year,

    month:
        selectedAdminDate.month

};


renderAdminCalendar();

}

};


/* =====================================================
   RENDER CALENDAR
===================================================== */

function renderAdminCalendar(){

const year =
    adminCalendarDate.year;

const month =
    adminCalendarDate.month;


document
.getElementById(
    "adminCalendarMonth"
)
.textContent =

months[month-1]
+
" "
+
persianNumber(year);


const daysContainer =
    document.getElementById(
        "adminCalendarDays"
    );


daysContainer.innerHTML =
    "";


const firstGregorian =
    jalaliToGregorian(
        year,
        month,
        1
    );


const firstDate =
    new Date(
        firstGregorian[0],
        firstGregorian[1]-1,
        firstGregorian[2]
    );


const startDay =
    (
        firstDate.getDay()+1
    ) % 7;


let daysInMonth;


if(month<=6){

daysInMonth=31;

}else if(month<=11){

daysInMonth=30;

}else{

daysInMonth=30;

}


/* EMPTY */

for(
    let i=0;
    i<startDay;
    i++
){

const empty =
    document.createElement(
        "div"
    );

empty.className =
    "admin-day empty";

daysContainer.appendChild(
    empty
);

}


/* DAYS */

for(
    let day=1;
    day<=daysInMonth;
    day++
){

const div =
    document.createElement(
        "div"
    );


div.className =
    "admin-day";


div.textContent =
    persianNumber(day);


/* TODAY */

if(
    year===todayJalali[0] &&
    month===todayJalali[1] &&
    day===todayJalali[2]
){

div.classList.add(
    "today"
);

}


/* SELECTED */

if(
    year===selectedAdminDate.year &&
    month===selectedAdminDate.month &&
    day===selectedAdminDate.day
){

div.classList.add(
    "selected"
);

}


div.onclick =
function(){

selectAdminDate(
    year,
    month,
    day
);

};


daysContainer.appendChild(
    div
);

}

}


/* =====================================================
   SELECT DATE
===================================================== */

function selectAdminDate(
    year,
    month,
    day
){

selectedAdminDate={

    year:
        year,

    month:
        month,

    day:
        day

};


updateDateButton();


document
.getElementById(
    "adminCalendar"
)
.classList.remove(
    "show"
);


loadForSelectedDate();

}


/* =====================================================
   PREVIOUS MONTH
===================================================== */

window.adminPreviousMonth =
function(){

adminCalendarDate.month--;


if(
    adminCalendarDate.month<1
){

adminCalendarDate.month=12;

adminCalendarDate.year--;

}


renderAdminCalendar();

};


/* =====================================================
   NEXT MONTH
===================================================== */

window.adminNextMonth =
function(){

adminCalendarDate.month++;


if(
    adminCalendarDate.month>12
){

adminCalendarDate.month=1;

adminCalendarDate.year++;

}


renderAdminCalendar();

};


/* =====================================================
   CHANGE DAY
===================================================== */

window.changeDate =
function(direction){

let gregorian =
    jalaliToGregorian(
        selectedAdminDate.year,
        selectedAdminDate.month,
        selectedAdminDate.day
    );


const date =
    new Date(
        gregorian[0],
        gregorian[1]-1,
        gregorian[2]
    );


date.setDate(
    date.getDate()+direction
);


const jalali =
    gregorianToJalali(
        date.getFullYear(),
        date.getMonth()+1,
        date.getDate()
    );


selectedAdminDate={

    year:
        jalali[0],

    month:
        jalali[1],

    day:
        jalali[2]

};


updateDateButton();


loadForSelectedDate();

};

   LOAD SELECTED DATE
===================================================== */

`
<div class="loading">

`;


try{

    );

list.filter(

if(

container.innerHTML =

📭

برای این تاریخ نوبتی ثبت نشده

}


/* RENDER */

container.innerHTML =
    "";


list.forEach(
    item => {

const vip =
    item.service ===
    "اصلاح VIP";


const duration =
    Number(
        item.duration_minutes
    )
    ||
    (
        vip
        ?
        60
        :
        30
    );


const time =
    normalizeTime(
        item.appointment_time
    );


const end =
    minutesToTime(
        timeToMinutes(time)
        +
        duration
    );


const div =
    document.createElement(
        "div"
    );


div.className =
    "appointment"
    +
    (
        vip
        ?
        " vip"
        :
        ""
    );


div.innerHTML = `

<div class="appointment-time">
${escapeHtml(time)}
</div>


<div class="service-name">
${
    vip
    ?
    "👑 اصلاح VIP"
    :
    "✂️ اصلاح"
}
</div>


<div class="customer">
👤 ${
    escapeHtml(
        item.name ||
        "بدون نام"
    )
}
</div>


<div class="phone">
📱 ${
    escapeHtml(
        item.phone ||
        "-"
    )
}
</div>


<div class="duration">
⏱ ${escapeHtml(time)} تا ${escapeHtml(end)}
</div>


<div class="actions">

<a
class="call-btn"
href="tel:${encodeURIComponent(item.phone || "")}">
📞 تماس
</a>


<button
class="delete-btn"
onclick="deleteAppointment('${item.id}')">

🗑 حذف رزرو

</button>

</div>

`;


container.appendChild(
    div
);

});


}catch(error){

console.error(error);


container.innerHTML =
`
<div class="empty">

❌ خطا در دریافت اطلاعات

<br><br>

${escapeHtml(
    error.message
)}

</div>
`;

}

};


/* =====================================================
   NORMALIZE DATE
===================================================== */

function normalizeDate(date){

if(!date){

return "";

}


/*
اگر Supabase تاریخ را به صورت
YYYY-MM-DD برگرداند،
آن را به تاریخ شمسی تبدیل می‌کنیم.
*/

if(
    /^\d{4}-\d{2}-\d{2}$/.test(date)
){

const parts =
    date.split("-");


const jalali =
    gregorianToJalali(
        Number(parts[0]),
        Number(parts[1]),
        Number(parts[2])
    );


return (
    persianNumber(
        jalali[2]
    )
    +
    " "
    +
    months[
        jalali[1]-1
    ]
    +
    " "
    +
    persianNumber(
        jalali[0]
    )
);

}


return String(date);

}


/* =====================================================
   NORMALIZE TIME
===================================================== */

function normalizeTime(time){

if(!time){

return "";

}


/*
مثلاً:

09:00:00+00
09:00:00
09:00
*/

return String(time)
    .substring(0,5);

}


/* =====================================================
   TIME
===================================================== */

function timeToMinutes(time){

const parts =
    time
    .split(":")
    .map(Number);


return (
    parts[0]*60
    +
    parts[1]
);

}


function minutesToTime(minutes){

let h =
    Math.floor(
        minutes/60
    );


let m =
    minutes%60;


return String(h)
    .padStart(2,"0")
+
":"
+
String(m)
    .padStart(2,"0");

}


/* =====================================================
   DELETE
===================================================== */

window.deleteAppointment =
async function(id){

if(
    !confirm(
        "آیا از حذف این رزرو مطمئن هستید؟"
    )
){

return;

}


try{

await supabaseRequest(
    "/rest/v1/appointments?id=eq." +
    encodeURIComponent(id),
    {
        method:
            "DELETE",

        headers:{
            "Prefer":
                "return=minimal"
        }
    }
);


alert(
    "رزرو حذف شد."
);


loadForSelectedDate();


}catch(error){

console.error(error);


alert(
    "خطا در حذف رزرو: "
    +
    error.message
);

}

};


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

return String(text)
.replace(
    /&/g,
    "&amp;"
)
.replace(
    /</g,
    "&lt;"
)
.replace(
    />/g,
    "&gt;"
)
.replace(
    /"/g,
    "&quot;"
)
.replace(
    /'/g,
    "&#039;"
);

}
