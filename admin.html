<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://zyhcplznilkhfjeocoet.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_jB4eqptL-Egyagl9u0r8wA_wnVoWLkf";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =========================================================
   VARIABLES
========================================================= */

let selectedAdminDate;

let adminCalendarDate;

let manualDate;

let manualCalendarDate;

let manualService="";

let manualTime="";


const months=[

"فروردین",
"اردیبهشت",
"خرداد",
"تیر",
"مرداد",
"شهریور",
"مهر",
"آبان",
"آذر",
"دی",
"بهمن",
"اسفند"

];


/* =========================================================
   PERSIAN NUMBER
========================================================= */

function persianNumber(num){

return String(num).replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}


/* =========================================================
   GREGORIAN → JALALI
========================================================= */

function gregorianToJalali(gy,gm,gd){

let gdm=[
0,31,59,90,120,151,
181,212,243,273,304,334
];

let jy;

if(gy>1600){

jy=979;
gy-=1600;

}else{

jy=0;
gy-=621;

}

let gy2=
gm>2
?gy+1
:gy;

let days=
365*gy+
Math.floor((gy2+3)/4)-
Math.floor((gy2+99)/100)+
Math.floor((gy2+399)/400)-
80+
gd+
gdm[gm-1];

jy+=33*Math.floor(days/12053);

days%=12053;

jy+=4*Math.floor(days/1461);

days%=1461;

if(days>365){

jy+=Math.floor((days-1)/365);

days=(days-1)%365;

}

let jm;
let jd;

if(days<186){

jm=1+Math.floor(days/31);
jd=1+(days%31);

}else{

jm=7+Math.floor((days-186)/30);
jd=1+((days-186)%30);

}

return [jy,jm,jd];

}


/* =========================================================
   JALALI → GREGORIAN
========================================================= */

function jalaliToGregorian(jy,jm,jd){

jy=parseInt(jy);
jm=parseInt(jm);
jd=parseInt(jd);

let gy;

if(jy>979){

gy=1600;
jy-=979;

}else{

gy=621;

}

let days=
365*jy+
Math.floor(jy/33)*8+
Math.floor(((jy%33)+3)/4)+
78+
jd+
(
jm<7
?
((jm-1)*31)
:
(((jm-7)*30)+186)
);

gy+=400*Math.floor(days/146097);

days%=146097;

if(days>36524){

gy+=100*Math.floor(--days/36524);

days%=36524;

if(days>=365)
days++;

}

gy+=4*Math.floor(days/1461);

days%=1461;

if(days>365){

gy+=Math.floor((days-1)/365);

days=(days-1)%365;

}

let gd=days+1;

let sal_a=[
0,
31,
((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,
31,30,31,30,31,31,30,31,30,31
];

let gm=0;

while(gd>sal_a[gm]){

gd-=sal_a[gm];
gm++;

}

return [gy,gm,gd];

}


/* =========================================================
   TODAY
========================================================= */

const now=new Date();

const todayJalali=
gregorianToJalali(
now.getFullYear(),
now.getMonth()+1,
now.getDate()
);


selectedAdminDate={
year:todayJalali[0],
month:todayJalali[1],
day:todayJalali[2]
};

adminCalendarDate={
year:todayJalali[0],
month:todayJalali[1]
};

manualDate={
year:todayJalali[0],
month:todayJalali[1],
day:todayJalali[2]
};

manualCalendarDate={
year:todayJalali[0],
month:todayJalali[1]
};


/* =========================================================
   DATE HELPERS
========================================================= */

function jalaliText(date){

return (
persianNumber(date.day)
+
" "
+
months[date.month-1]
+
" "
+
persianNumber(date.year)
);

}


function jalaliISO(date){

const g=
jalaliToGregorian(
date.year,
date.month,
date.day
);

return (
String(g[0]).padStart(4,"0")
+
"-"+
String(g[1]).padStart(2,"0")
+
"-"+
String(g[2]).padStart(2,"0")
);

}


/* =========================================================
   ADMIN DATE
========================================================= */

function updateAdminDate(){

document
.getElementById("jalaliDateButton")
.textContent=
jalaliText(selectedAdminDate);

document
.getElementById("datePicker")
.value=
jalaliISO(selectedAdminDate);

}


/* =========================================================
   ADMIN CALENDAR
========================================================= */

window.toggleAdminCalendar=function(){

const el=
document.getElementById("adminCalendar");

el.classList.toggle("show");

if(el.classList.contains("show")){

adminCalendarDate={
year:selectedAdminDate.year,
month:selectedAdminDate.month
};

renderAdminCalendar();

}

};


function renderAdminCalendar(){

const year=adminCalendarDate.year;
const month=adminCalendarDate.month;

document
.getElementById("adminCalendarMonth")
.textContent=
months[month-1]+" "+persianNumber(year);

const container=
document.getElementById("adminCalendarDays");

container.innerHTML="";

const first=
jalaliToGregorian(
year,
month,
1
);

const date=
new Date(
first[0],
first[1]-1,
first[2]
);

const startDay=
(date.getDay()+1)%7;

let days;

if(month<=6)
days=31;
else if(month<=11)
days=30;
else
days=30;

for(let i=0;i<startDay;i++){

const empty=document.createElement("div");

empty.className="admin-day empty";

container.appendChild(empty);

}

for(let day=1;day<=days;day++){

const div=document.createElement("div");

div.className="admin-day";

div.textContent=
persianNumber(day);

if(
year===todayJalali[0] &&
month===todayJalali[1] &&
day===todayJalali[2]
){

div.classList.add("today");

}

if(
year===selectedAdminDate.year &&
month===selectedAdminDate.month &&
day===selectedAdminDate.day
){

div.classList.add("selected");

}

div.onclick=function(){

selectedAdminDate={
year:year,
month:month,
day:day
};

updateAdminDate();

document
.getElementById("adminCalendar")
.classList.remove("show");

loadForSelectedDate();

};

container.appendChild(div);

}

}


window.adminPreviousMonth=function(){

adminCalendarDate.month--;

if(adminCalendarDate.month<1){

adminCalendarDate.month=12;
adminCalendarDate.year--;

}

renderAdminCalendar();

};


window.adminNextMonth=function(){

adminCalendarDate.month++;

if(adminCalendarDate.month>12){

adminCalendarDate.month=1;
adminCalendarDate.year++;

}

renderAdminCalendar();

};


window.changeDate=function(direction){

const g=
jalaliToGregorian(
selectedAdminDate.year,
selectedAdminDate.month,
selectedAdminDate.day
);

const d=
new Date(
g[0],
g[1]-1,
g[2]
);

d.setDate(
d.getDate()+direction
);

const j=
gregorianToJalali(
d.getFullYear(),
d.getMonth()+1,
d.getDate()
);

selectedAdminDate={
year:j[0],
month:j[1],
day:j[2]
};

updateAdminDate();

loadForSelectedDate();

};


/* =========================================================
   TIME
========================================================= */

function timeToMinutes(time){

if(!time)
return 0;

const clean=
String(time).substring(0,5);

const parts=
clean.split(":");

return Number(parts[0])*60+
Number(parts[1]);

}


function minutesToTime(minutes){

const h=
Math.floor(minutes/60);

const m=
minutes%60;

return String(h).padStart(2,"0")
+
":"
+
String(m).padStart(2,"0");

}


/* =========================================================
   EXACT SITE TIMES
========================================================= */

const NORMAL_TIMES=[

"08:30",
"09:00",
"09:30",

/* =========================================================
   LOAD APPOINTMENTS
========================================================= */

async function getAppointments(){

const {
data,
error
}=
await supabase
.from("appointments")
.select("*")
.order(
"appointment_time",
{ascending:true}
);

if(error)
throw error;

return data||[];

}


/* =========================================================
   CHECK OVERLAP
========================================================= */

function appointmentOverlaps(
start,
duration,
item
){

const bookedStart=
timeToMinutes(
item.appointment_time
);

const bookedDuration=
Number(item.appointment_minute)
||
Number(item.duration_minutes)
||
(
item.service==="اصلاح VIP"
?60
:30
);

const bookedEnd=
bookedStart+bookedDuration;

const currentEnd=
start+duration;

return (
start<bookedEnd &&
currentEnd>bookedStart
);

}

========================================================= */

window.loadForSelectedDate=
async function(){

const container=
document.getElementById("appointments");

container.innerHTML=
`
<div class="loading">
در حال دریافت نوبت‌ها...
</div>
`;

try{

const all=
await getAppointments();

const date=
jalaliISO(selectedAdminDate);

const list=
all.filter(
item=>
String(item.appointment_date)
.substring(0,10)===date
);

list.sort(
(a,b)=>
timeToMinutes(a.appointment_time)
-
timeToMinutes(b.appointment_time)
);

document
.getElementById("totalCount")

📱 ${escapeHtml(item.phone||"-")}

⏱ ${escapeHtml(start)}

 ${escapeHtml(end)}

window.toggleManualCalendar=function(){

const el=
document.getElementById("manualCalendar");

el.classList.toggle("show");

if(el.classList.contains("show")){

manualCalendarDate={
year:manualDate.year,
month:manualDate.month
};

renderManualCalendar();

}

};


function renderManualCalendar(){

const year=manualCalendarDate.year;
const month=manualCalendarDate.month;

document
.getElementById("manualCalendarMonth")
.textContent=
months[month-1]+" "+persianNumber(year);

const container=
document.getElementById("manualCalendarDays");

container.innerHTML="";

const first=
jalaliToGregorian(
year,
month,
1
);

const date=
new Date(
first[0],
first[1]-1,
first[2]
);

const startDay=
(date.getDay()+1)%7;

let days;

if(month<=6)
days=31;
else if(month<=11)
days=30;
else
days=30;

for(let i=0;i<startDay;i++){

const empty=
document.createElement("div");

empty.className="admin-day empty";

container.appendChild(empty);

}

for(let day=1;day<=days;day++){

const div=
document.createElement("div");

div.className="admin-day";

div.textContent=
persianNumber(day);

if(
year===todayJalali[0] &&
month===todayJalali[1] &&
day===todayJalali[2]
){

div.classList.add("today");

}

if(
year===manualDate.year &&
month===manualDate.month &&
day===manualDate.day
){

div.classList.add("selected");

}

let past=false;

if(year<todayJalali[0])
past=true;

else if(
year===todayJalali[0] &&
month<todayJalali[1]
)
past=true;

else if(
year===todayJalali[0] &&
month===todayJalali[1] &&
day<todayJalali[2]
)
past=true;

if(past){

div.style.opacity=".25";
div.style.cursor="not-allowed";

}else{

div.onclick=function(){

manualDate={
year:year,
month:month,
day:day
};

updateManualDate();

document
.getElementById("manualCalendar")
.classList.remove("show");

renderManualTimes();

};

}

container.appendChild(div);

}

}


window.manualPreviousMonth=function(){

manualCalendarDate.month--;

if(manualCalendarDate.month<1){

manualCalendarDate.month=12;
manualCalendarDate.year--;

}

renderManualCalendar();

};


window.manualNextMonth=function(){

manualCalendarDate.month++;

if(manualCalendarDate.month>12){

manualCalendarDate.month=1;
manualCalendarDate.year++;

}

renderManualCalendar();

};

/* =========================================================
   MANUAL TIMES
========================================================= */

async function renderManualTimes(){

const container=
document.getElementById("manualTimes");

if(!manualService){

container.innerHTML=
`
<div
style="
grid-column:1/-1;
text-align:center;
color:#666;
padding:15px;">
ابتدا نوع خدمت را انتخاب کنید
</div>
`;

return;

}

const times=
manualService==="اصلاح"
?NORMAL_TIMES
:VIP_TIMES;

container.innerHTML="";

let appointments=[];

try{

appointments=
await getAppointments();

}catch(error){

console.error(error);

}

const date=
jalaliISO(manualDate);

times.forEach(time=>{

const btn=
document.createElement("button");

btn.type="button";

btn.className="manual-time";

btn.textContent=time;

const duration=
manualService==="اصلاح VIP"
?60
:30;

const start=
timeToMinutes(time);

const booked=
appointments.some(item=>
String(item.appointment_date)
.substring(0,10)===date
&&
appointmentOverlaps(
start,
duration,
item
)
);

if(booked){

btn.classList.add("booked");

btn.onclick=function(){

alert(
"این ساعت قبلاً رزرو شده است."
);

};

}else{

btn.onclick=function(){

document
.querySelectorAll(".manual-time")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

manualTime=time;

};

}

container.appendChild(btn);

});

}

window.saveManualAppointment=
async function(){

const name=
document
.getElementById("manualName")
.value
.trim();

const phone=
document
.getElementById("manualPhone")
.value
.trim();

const message=
document
.getElementById("manualMessage");

message.innerHTML="";

if(!manualService){

alert(
"لطفاً نوع خدمت را انتخاب کنید."
);

return;

}

if(!manualTime){

alert(
"لطفاً ساعت نوبت را انتخاب کنید."
);

return;

}

if(!name){

alert(
"لطفاً نام مشتری را وارد کنید."
);

return;

}

if(
phone &&
!/^09\d{9}$/.test(phone)
){

alert(
"شماره تماس معتبر نیست."
);

return;

}

const date=
jalaliISO(manualDate);

const duration=
manualService==="اصلاح VIP"
?60
:30;

try{

/* بررسی آخرین وضعیت */

const appointments=
await getAppointments();

const conflict=
appointments.some(item=>
String(item.appointment_date)
.substring(0,10)===date
&&
appointmentOverlaps(
timeToMinutes(manualTime),
duration,
item
)
);

if(conflict){

await renderManualTimes();

throw new Error(
"این ساعت همین الان رزرو شده است."
);

}


/* INSERT */

const {
error
}=
await supabase
.from("appointments")
.insert({

service:manualService,

name:name,

phone:phone,

appointment_date:date,

appointment_time:manualTime,

appointment_minute:duration,

duration_minutes:duration,

created_at:new Date().toISOString()

});

if(error)
throw error;


/* SUCCESS */

message.innerHTML=
`
<div class="success-box">
✅ رزرو دستی با موفقیت ثبت شد.
<br><br>
خدمت: ${escapeHtml(manualService)}
<br>
نام: ${escapeHtml(name)}
<br>
ساعت: ${escapeHtml(manualTime)}
</div>
`;


/* CLEAR */

document
.getElementById("manualName")
.value="";

document
.getElementById("manualPhone")
.value="";

manualTime="";

await renderManualTimes();

}catch(error){

console.error(error);

message.innerHTML=
`
<div class="error-box">
❌ خطا در ثبت رزرو
<br><br>
${escapeHtml(error.message)}
</div>
`;

}

};

window.login=
async function(){

const email=
document
.getElementById("adminEmail")
.value
.trim();

const password=
document
.getElementById("adminPassword")
.value;

const button=
document
.getElementById("loginButton");

const errorBox=
document
.getElementById("loginError");

errorBox.innerHTML="";

if(!email){

errorBox.innerHTML=
`
<div class="error-box">
لطفاً ایمیل مدیر را وارد کنید.
</div>
`;

return;

}

if(!password){

errorBox.innerHTML=
`
<div class="error-box">
لطفاً رمز مدیریت را وارد کنید.
</div>
`;

return;

}

button.disabled=true;
button.textContent="در حال ورود...";

try{

const {
data,
error
}=
await supabase.auth.signInWithPassword({

password:password

});

if(error)
throw error;

if(!data.session){

throw new Error(
"ورود انجام نشد."
);

}

await showAdmin();

}catch(error){

console.error(error);

errorBox.innerHTML=
`
<div class="error-box">
❌ ورود ناموفق بود
<br>
${escapeHtml(error.message)}
</div>
`;

}finally{

button.disabled=false;
button.textContent="ورود به پنل";

}

};

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(text){

return String(text??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

   START
========================================================= */

const {
data
}=
await supabase.auth.getSession();

if(data.session){

await showAdmin();

}else{

document
.getElementById("loginPage")
.style.display="block";

document
.getElementById("adminPage")
.style.display="none";

}

}

start();
